# Dated exceptions for open advisories in the lockfiles in this directory
# (uv.lock, package-lock.json).
# Schema: https://google.github.io/osv-scanner/configuration/ ([[IgnoredVulns]]).
# osv-scanner applies a config file only to lockfiles in its own directory, and
# the gate passes no --config, so each lockfile directory with an exception keeps
# its own osv-scanner.toml and no entry here hides an advisory in another
# lockfile. Each entry names its category (D = 120-day rectification interval,
# entered 2026-11-02) and the trigger that ends it. An entry past ignoreUntil
# excuses nothing; renew it only with a fresh check of the trigger.

[[IgnoredVulns]]
