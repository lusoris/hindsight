# A pull request that changes an exception file (osv-scanner.toml) or the
# exception gate itself needs the osv-exception label, which only accounts with
# triage or write access can apply.
#
# pull_request_target runs this workflow, and the checker it checks out, from
# the base branch, so a pull request cannot change the check that judges it.
# No pull request code is checked out or run: the pull request's commits are
# only fetched as objects, and the paths git diff lists are matched against a
# pattern. git diff has no listing limit (the pull request files API stops at
# 3000 files), and any failure fails the job. The token is read-only.
name: OSV exception approval

on:
  pull_request_target:  # zizmor: ignore[dangerous-triggers] base code only, PR code never checked out
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  approval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # The base branch: trusted code. Never the pull request head.
          ref: ${{ github.event.pull_request.base.sha }}
          # Full history, so git diff can find the merge base.
          fetch-depth: 0
          persist-credentials: false
      - name: Gated changes need the osv-exception label
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          OSV_EXCEPTION_APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'osv-exception') && '1' || '0' }}
        run: |
          set -euo pipefail
          # Objects only; nothing from the pull request is checked out.
          git fetch --no-tags origin "$HEAD_SHA"
          scripts/check-osv-config.sh "$BASE_SHA" "$HEAD_SHA"
