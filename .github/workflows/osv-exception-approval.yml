# A pull request that changes an exception file (osv-scanner.toml) or the
# exception gate itself needs the osv-exception label, which only accounts with
# triage or write access can apply.
#
# pull_request_target runs this workflow, and the checker it checks out, from
# the base branch, so a pull request cannot change the check that judges it.
# No pull request code is checked out or run: the changed paths come from the
# API and are only matched against a pattern. The token is read-only.
name: OSV exception approval

on:
  pull_request_target:  # zizmor: ignore[dangerous-triggers] base code only, PR code never checked out
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  approval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # The base branch: trusted code. Never the pull request head.
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Gated changes need the osv-exception label
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          OSV_EXCEPTION_APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'osv-exception') && '1' || '0' }}
        run: |
          gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[] | .filename, (.previous_filename // empty)' \
            | python3 scripts/check-osv-config.py --changed
