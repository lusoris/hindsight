# Scans every lockfile in the repository. osv-scanner applies an
# osv-scanner.toml only to lockfiles in its own directory; no --config is
# passed, so an exception is scoped to the lockfile directory that holds it.
name: OSV-Scanner

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # labeled/unlabeled re-run the exception gate when osv-exception changes.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  # Advisories published after the last push still reach unchanged lockfiles.
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      # osv-scanner skips a config it cannot parse and only logs it, which
      # would drop every exception in that directory; fail on it instead.
      - name: Check exception files
        run: python3 scripts/check-osv-config.py
      # The scan reads the pull request's own exception files, so its author
      # could except an advisory their change brings in. A changed
      # osv-scanner.toml needs the osv-exception label, which only accounts
      # with triage or write access can apply.
      - name: Exception changes need the osv-exception label
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          OSV_EXCEPTION_APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'osv-exception') && '1' || '0' }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          python3 scripts/check-osv-config.py --changed-since "$BASE_SHA"
      # Exits non-zero on any finding the config does not except, and on a
      # failed scan.
      - name: Scan lockfiles
        uses: google/osv-scanner-action/osv-scanner-action@0a65f82af05cd58cf587827b0bb0489548c18346 # v2.7.0
        with:
          scan-args: |-
            --recursive
            ./
