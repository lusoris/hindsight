---
engines:
  duplication:
    exclude_paths:
      # category D, entry 2026-11-07, expiry 2027-03-07, rule duplication: OpenAPI Generator output, regenerated from the API spec
      - "hindsight-clients/python/hindsight_client_api/**"
      # category D, entry 2026-11-21, expiry 2027-03-21, rule duplication: OpenAPI Generator go output (scripts/generate-clients.sh), every file carries the Code generated DO NOT EDIT header
      - "hindsight-clients/go/api_*.go"
      # category D, entry 2026-11-21, expiry 2027-03-21, rule duplication: OpenAPI Generator go output (scripts/generate-clients.sh), every file carries the Code generated DO NOT EDIT header
      - "hindsight-clients/go/model_*.go"
      # category D, entry 2026-11-21, expiry 2027-03-21, rule duplication: OpenAPI Generator go test stubs (scripts/generate-clients.sh), every file carries the Code generated DO NOT EDIT header
      - "hindsight-clients/go/test/api_*_test.go"
      # category D, entry 2026-11-21, expiry 2027-03-21, rule duplication: OpenAPI Generator go supporting files (scripts/generate-clients.sh), each carries the Code generated DO NOT EDIT header; hindsight_client.go and the root tests stay scanned
      - "hindsight-clients/go/{client,configuration,response,utils}.go"
      # category D, entry 2026-11-21, expiry 2027-03-21, rule duplication: @hey-api/openapi-ts output (openapi-ts.config.ts output.path), every file carries its auto-generated header
      - "hindsight-clients/typescript/generated/**"
      # category D, entry 2026-11-08, expiry 2027-03-08, rule duplication: generated copy of hindsight-integrations/_shared/user_config.py, kept identical by scripts/sync-integration-config.py --check
      - "hindsight-integrations/aider/hindsight_aider/_user_config.py"
      # category D, entry 2026-11-08, expiry 2027-03-08, rule duplication: generated copy of hindsight-integrations/_shared/user_config.py, kept identical by scripts/sync-integration-config.py --check
      - "hindsight-integrations/github-copilot/hindsight_copilot/_user_config.py"
      # category D, entry 2026-11-08, expiry 2027-03-08, rule duplication: generated copy of hindsight-integrations/_shared/user_config.py, kept identical by scripts/sync-integration-config.py --check
      - "hindsight-integrations/openhands/hindsight_openhands/_user_config.py"
      # category D, entry 2026-11-08, expiry 2027-03-08, rule duplication: generated copy of hindsight-integrations/_shared/user_config.py, kept identical by scripts/sync-integration-config.py --check
      - "hindsight-integrations/devin-desktop/hindsight_devin_desktop/_user_config.py"
  bandit:
    exclude_paths:
      # category D, entry 2026-11-13, expiry 2027-03-13, rule bandit: B404, B603 and B607 on a test that must run git, lint.sh and its recorder stubs as processes; literal argv lists so the Opengrep subprocess audit sees a static command, git and bash resolved from PATH, the stub run as ./tool from its directory, no shell, which hindsight-dev/tests/test_bandit_exclusions.py checks
      - "hindsight-dev/tests/test_lint_hook_pins.py"
      # category D, entry 2026-11-13, expiry 2027-03-13, rule bandit: B404, B603 and B607 on a test that must run git and the suppression wrapper as processes; literal argv lists so the Opengrep subprocess audit sees a static command, git and bash resolved from PATH, no shell, which hindsight-dev/tests/test_bandit_exclusions.py checks
      - "hindsight-dev/tests/test_check_scanner_suppressions.py"
      # category D, entry 2026-11-14, expiry 2027-03-14, rule bandit: B404, B603 and B607 on a test that must run git and scripts/setup-hooks.sh as processes; literal argv lists so the Opengrep subprocess audit sees a static command, git and bash resolved from PATH, no shell, which hindsight-dev/tests/test_bandit_exclusions.py checks
      - "hindsight-dev/tests/test_setup_hooks.py"
