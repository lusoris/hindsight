      # category D, entry 2026-11-08, expiry 2027-03-08, rule duplication: generated copy of hindsight-integrations/_shared/user_config.py, kept identical by scripts/sync-integration-config.py --check
      - "hindsight-integrations/openhands/hindsight_openhands/_user_config.py"
