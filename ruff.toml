line-length = 120
target-version = "py311"
# Source roots for isort's first-party detection when ruff runs from the repository root
# with this file. Codacy does: its runner (codacy/codacy-ruff) passes the first root config
# it lists as `--config`, and the root pyproject.toml extends this file, so either one
# resolves here. With the default `[".", "src"]` every package's own modules (hindsight_api,
# tests, ...) count as third-party there, so an import block that `scripts/hooks/lint.sh`
# sorts correctly per package is reported as I001. lint.sh passes `--config` from each
# integration's own directory, where these relative paths resolve under that directory and
# match nothing, so its results do not change.
#
# The list names package directories instead of globbing `hindsight-*`: that glob would
# also make `hindsight-integrations/` a source root, whose children are named after the
# frameworks they wrap (litellm, crewai, ...), turning `import litellm` first-party.
# hindsight-clients/python is left out because the integrations import hindsight_client
# as a dependency and sort it with the third-party block.
src = [
    ".",
    "src",
    "hindsight-all",
    "hindsight-all-slim",
    "hindsight-api",
    "hindsight-api-slim",
    "hindsight-dev",
    "hindsight-embed",
    "hindsight-integration-tests",
    "hindsight-system-evals",
    "hindsight-system-tests",
    "hindsight-extensions/*",
    "hindsight-integrations/*",
]
exclude = [
    "**/.venv/",
    "**/dist/",
    "**/build/",
]

[lint]
# Tests are formatted (via `ruff format`) but excluded from lint rules, which
# are too noisy for test code (unused imports/vars, import ordering).
exclude = [
    "tests/**",
    "**/tests/**",
]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "E402",   # module import not at top of file
    "F401",   # unused import (too noisy during development)
    "F841",   # unused variable (too noisy during development)
    "F811",   # redefined while unused
    "F821",   # undefined name (forward references in type hints)
]

[format]
quote-style = "double"
indent-style = "space"
